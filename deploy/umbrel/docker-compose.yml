# jass-bot on an Umbrel server, deployed as a project in Arcane, see README.md next to this file.
#
# Arcane's auto update replaces the container when GitHub Actions has published
# a new :latest image.

services:
  jass-bot:
    image: ghcr.io/sili-dev/jass-kit-py:latest
    container_name: jass-bot
    restart: unless-stopped
    ports:
      - "${JASS_BOT_PORT:-8888}:8888"
    labels:
      # explicit, so the bot keeps updating even if updates become opt-in
      - com.getarcaneapp.arcane.updater=true
